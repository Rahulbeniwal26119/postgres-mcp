name: CI

on:
    push:
        branches: [master]
    pull_request:

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-go@v7
              with:
                go-version-file: go.mod
            
            - name: gofmt
              run: test -z "$(gofmt -l . | tee /dev/stderr)
            
            - name: go mod tidy
              run: go mod tidy -diff
            
            - name: go vet
              run: go vet ./... 
            
            - name: staticcheck
              run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.2 ./...
            
            - name: govulncheck
              run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
            - name: test
              run: go test -race -count=1 ./...
