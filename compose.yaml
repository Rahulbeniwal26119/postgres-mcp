services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pagila
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ./db/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "pagila"]
      interval: 2s
      timeout: 5s
      retries: 60
  jaeger:
    image: jaegertracing/jaeger:2.23.0
    profiles: ["tracing"]
    ports:
      - "127.0.0.1:16686:16686" # UI
      - "127.0.0.1:4318:4318" # OLTP/HTTP